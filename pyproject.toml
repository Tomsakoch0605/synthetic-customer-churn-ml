[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-customer-churn-ml"
version = "0.1.0"
description = "Independent end-to-end machine learning portfolio project on fictional subscription churn"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
